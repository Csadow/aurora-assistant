<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora · Overlay</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/companion.css"><script type="module" src="/companion-window.js"></script></head><body class="companion-body" data-arranging="false"><aside id="companion-section" aria-label="Aurora companion">
